- title: Selected Research
  type: nested_list
  contents:
    - title: "OPSERVE — Opportunistic LLM Inference over Fragmented GPU Capacity in HPC Systems"
      items:
        - Designed a malleable LLM serving architecture that combines persistent inference capacity with transient GPU resources exposed by HPC batch schedulers.
        - Developed adaptive prefill/decode worker allocation and shared KV-cache mechanisms for preserving completed prefill state as transient workers are added or reclaimed.
        - Characterized a year of Polaris traces and identified 9.81% of operational node-hours as unallocated capacity; OPSERVE reduced p95 end-to-end latency by 1.5–2.1× under sustainable loads and by up to 14.3× in evaluated overload scenarios.
        - "Accepted to AIonHPC @ SC26, 2026."
    - title: "BatchFlow — Benefit-Aware Data Pipeline Allocation and Batch Reuse for Multi-Job Training"
      items:
        - Designed a distributed data-pipeline service that treats data preparation workers and cache capacity as shared cluster resources across concurrent deep-learning jobs.
        - Developed online profiling and benefit-aware scheduling for dynamically allocating workers, prefetching mini-batches, and exploiting cross-job data reuse.
        - Built a PyTorch-compatible prototype evaluated on AWS; improved aggregate training throughput by up to 3.8× and cost efficiency by up to 2.1× over evaluated baselines.
        - "Accepted to SC26, 2026."
    - title: "zkInfer — Distributed Proof Generation for Verifiable Machine Learning"
      items:
        - Designed a distributed proof-serving architecture that decomposes ML inference into independently executable zero-knowledge proving jobs.
        - Developed resource-aware scheduling, memory-aware admission, reusable proving artifacts, and cryptographic commitments for composing independently generated proofs.
        - Reduced end-to-end proving latency by up to 5.6× through decomposition on a single worker and by up to 69× with distributed execution, while reducing peak per-machine memory by up to 48× in evaluated workloads.

