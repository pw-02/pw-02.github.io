- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Research Assistant
      institution: Intelligent Data and Systems Lab, University of Nevada, Reno
      year: 07/2021 – Present
      description:
        - "<strong>OPSERVE:</strong> Built a malleable LLM serving system that combines persistent and transient GPU workers in batch-scheduled HPC environments, dynamically adapting prefill/decode capacity and preserving completed prefill state through shared KV storage. In evaluated workloads, OPSERVE reduced p95 end-to-end latency by 1.5–2.1× under sustainable load and by up to 14.3× under overload. Accepted to AIonHPC @ SC26, 2026."
        - "<strong>BatchFlow:</strong> Built a distributed data-pipeline service for multi-job training that dynamically allocates shared data workers and cache capacity using online profiling and benefit-aware scheduling. A PyTorch-compatible prototype evaluated on AWS improved aggregate training throughput by up to 3.8× and cost efficiency by up to 2.1×. Accepted to SC26, 2026."
        - "<strong>zkInfer:</strong> Designed a distributed proof-serving architecture for verifiable ML that decomposes inference into independently executable zero-knowledge proving jobs with resource-aware scheduling, memory-aware admission, and reusable proving artifacts. In evaluated workloads, decomposition reduced latency by up to 5.6× on one worker and distributed execution by up to 69×, while reducing peak per-machine memory by up to 48×."
        - "<strong>HDRFS:</strong> Contributed machine-learning and data-pipeline work for multimodal wildland-fire sensor data as part of the NSF EPSCoR Harnessing the Data Revolution for Fire Science project, and presented research at annual project meetings over the past three years."
    - title: Ph.D. Research Intern
      institution: Nokia Bell Labs, Stuttgart, Germany
      year: 08/2022 – 11/2022
      description:
        - Designed and implemented a distributed zero-knowledge proof-generation system using Apache Spark.
        - Parallelized Number Theoretic Transform and Multi-Scalar Multiplication workloads across cluster resources to investigate proof-generation scalability and latency.
        - Characterized compute, memory, and parallelization bottlenecks in large-scale cryptographic workloads and presented findings to Bell Labs research teams.

